plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

repositories {
	maven { url = 'https://maven.shedaniel.me/' }
	maven { url = 'https://maven.terraformersmc.com/releases/' }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"invfull" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Optional: in-game config screen via Mod Menu + Cloth Config
	compileOnly("me.shedaniel.cloth:cloth-config-fabric:26.3.158") { exclude group: 'net.fabricmc.fabric-api' }
	compileOnly("com.terraformersmc:modmenu:21.0.1") { transitive = false }
	localRuntime("me.shedaniel.cloth:cloth-config-fabric:26.3.158") { exclude group: "net.fabricmc.fabric-api" }
	localRuntime("com.terraformersmc:modmenu:21.0.1") { transitive = false }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// ---------------------------------------------------------------------------
// Publishing to Modrinth / CurseForge / GitHub Releases.
//   ./gradlew publishMods             -> dry run only (files go to build/publishMods)
//   ./gradlew publishMods -Prelease   -> real upload
// Tokens come from environment variables only: MODRINTH_TOKEN, CURSEFORGE_TOKEN, GITHUB_TOKEN.
// A platform is skipped while its project id in gradle.properties is empty.
// ---------------------------------------------------------------------------
def changelogFor = { String ver ->
	// Text under "## <ver>" up to the next "## " heading.
	def lines = file("CHANGELOG.md").readLines("UTF-8")
	int start = lines.findIndexOf { it.trim() == "## " + ver }
	if (start < 0) return "See CHANGELOG.md"
	int end = lines.findIndexOf(start + 1) { it.startsWith("## ") }
	(end < 0 ? lines.subList(start + 1, lines.size()) : lines.subList(start + 1, end)).join("\n").trim()
}

publishMods {
	file = jar.archiveFile
	displayName = "InvFull & Durability Alerts ${project.version}"
	changelog = changelogFor(project.version.toString())
	type = STABLE
	modLoaders.add("fabric")
	dryRun = !providers.gradleProperty("release").isPresent()

	def mrId = providers.gradleProperty("modrinth_id").getOrElse("")
	if (mrId) {
		modrinth {
			projectId = mrId
			accessToken = providers.environmentVariable("MODRINTH_TOKEN")
			minecraftVersions.add(project.minecraft_version)
			environment = CLIENT_ONLY
			requires("fabric-api")
			optional("modmenu")
			optional("cloth-config")
		}
	}

	def cfId = providers.gradleProperty("curseforge_id").getOrElse("")
	if (cfId) {
		curseforge {
			projectId = cfId
			projectSlug = "invfull-durability-alerts"
			accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
			minecraftVersions.add(project.minecraft_version)
			javaVersions.add(JavaVersion.VERSION_25)
			client = true
			server = false
			requires("fabric-api")
			optional("modmenu")
			optional("cloth-config")
		}
	}

	github {
		repository = "Vivegass/invfull-durability-alerts"
		accessToken = providers.environmentVariable("GITHUB_TOKEN")
		commitish = "main"
		tagName = "v${project.version}"
	}
}
